<div class="flex flex-col justify-center gap-4 my-3" role="img" aria-label="Rated 3 out of 5 stars">
  <div class="w-full rounded">
    <h3 class="text-slate-900 text-[17px] text-base font-semibold dark:text-slate-50">Rating</h3>
  </div>
  <div class="flex justify-center gap-2">
    @for (star of starNum; track $index) {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="size-[18px] fill-[#CED5D8]"
        viewBox="0 0 24 24"
        aria-hidden="true"
        id="{{ star }}"
        [class.yellow]="rating() >= star"
        (click)="onSelectRating(star)"
      >
        <path
          d="m23.363 8.584-7.378-1.127L12.678.413c-.247-.526-1.11-.526-1.357 0L8.015 7.457.637 8.584a.75.75 0 0 0-.423 1.265l5.36 5.494-1.267 7.767a.75.75 0 0 0 1.103.777L12 20.245l6.59 3.643a.75.75 0 0 0 1.103-.777l-1.267-7.767 5.36-5.494a.75.75 0 0 0-.423-1.266z"
          data-original="#ffc107"
        />
      </svg>
    }
  </div>
</div>
