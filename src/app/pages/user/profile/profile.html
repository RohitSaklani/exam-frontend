<main class="min-h-screen flex flex-col justify-center p-4 md:p-8">
  <div class="w-full max-w-lg mx-auto sm:max-w-4xl">
    <form class="w-full" [formGroup]="profileForm">
      <div class="grid sm:grid-cols-2 gap-6">
        <div class="col-span-full flex flex-col justify-center items-center">
          <img
            src="/dummy-user.png"
            alt="Profile Picture"
            class="rounded-full w-32 h-32 mx-auto border-4 border-indigo-800 mb-4 transition-transform duration-300 hover:scale-105 ring ring-gray-300"
          />
          <input type="file" name="profile" id="upload_profile" hidden required />

          <label for="upload_profile" class="inline">
            <svg
              data-slot="icon"
              class="w-5 h-5 text-blue-700"
              fill="none"
              stroke-width="1.5"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z"
              ></path>
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z"
              ></path>
            </svg>
          </label>

          <button
            class="bg-indigo-800 text-white px-4 py-2 rounded-lg hover:bg-blue-900 transition-colors duration-300 ring ring-gray-300 hover:ring-indigo-300 mt-2"
          >
            Change Profile Picture
          </button>
        </div>

        <div>
          <label
            for="username"
            class="mb-2 text-slate-900 font-medium text-sm inline-block dark:text-slate-50"
            readonly
            >username</label
          >
          <input
            type="text"
            name="username"
            formControlName="username"
            id="username"
            placeholder="John"
            required
            class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-gray-200 w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-700 dark:outline-neutral-700"
          />
        </div>

        <div>
          <label
            for="firstName"
            class="mb-2 text-slate-900 font-medium text-sm inline-block dark:text-slate-50"
            >First Name</label
          >
          <input
            type="text"
            name="firstName"
            formControlName="firstName"
            id="firstName"
            placeholder="John"
            required
            class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700"
          />
        </div>
        <div>
          <label
            for="lastName"
            class="mb-2 text-slate-900 font-medium text-sm inline-block dark:text-slate-50"
            >Last Name</label
          >
          <input
            type="text"
            name="lastName"
            formControlName="lastName"
            id="lastName"
            placeholder="Doe"
            required
            class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700"
          />
        </div>
        <div>
          <label
            for="email"
            class="mb-2 text-slate-900 font-medium text-sm inline-block dark:text-slate-50"
            >Email</label
          >
          <input
            type="email"
            name="email"
            id="email"
            formControlName="email"
            placeholder="john@readymadeui.com"
            required
            class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700"
          />
        </div>
        <div>
          <label
            for="mobile"
            class="mb-2 text-slate-900 font-medium text-sm inline-block dark:text-slate-50"
            >Mobile Number</label
          >
          <input
            type="tel"
            name="phone"
            id="phone"
            formControlName="phone"
            placeholder="1234567890"
            required
            class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-800 dark:outline-neutral-700"
          />
        </div>
      </div>

      <div class="mt-6 flex gap-2 justify-end items-end">
        <button
          type="submit"
          class="py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
          (click)="updateUserDetails()"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
</main>
